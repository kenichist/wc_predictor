features:
  default_start_date: "2010-01-01"

match_weights:
  recency_decay_days: 730
  multipliers:
    world_cup: 1.50
    continental_championship: 1.25
    world_cup_qualifier: 1.15
    continental_qualifier: 1.10
    nations_league: 1.00
    friendly: 0.70
    other: 1.00

elo:
  default_elo: 1500
  k_factor: 20
  home_advantage: 50
  k_multipliers:
    world_cup: 1.50
    continental_championship: 1.25
    world_cup_qualifier: 1.15
    continental_qualifier: 1.10
    nations_league: 1.00
    friendly: 0.70
    other: 1.00

internal_historical_elo:
  default_elo: 1500
  k_factor: 20
  home_advantage: 50
  goal_diff_cap: 4
  shootout_win_score: 0.75
  k_multipliers:
    world_cup: 1.50
    continental_championship: 1.25
    world_cup_qualifier: 1.15
    continental_qualifier: 1.10
    nations_league: 1.00
    friendly: 0.70
    other: 1.00

dynamic_ratings:
  base_rating: 1500
  k_factor: 24
  home_advantage: 55
  goal_diff_cap: 4
  k_multipliers:
    world_cup: 1.70
    continental_championship: 1.35
    world_cup_qualifier: 1.20
    continental_qualifier: 1.12
    nations_league: 1.00
    friendly: 0.70
    other: 1.00

modeling:
  train_end: "2022-01-01"
  validation_start: "2022-01-01"
  validation_end: "2025-01-01"
  test_start: "2025-01-01"
  random_seed: 42
  catboost_use_gpu: true
  catboost_gpu_devices: "0"
  catboost_iterations: 300
  catboost_depth: 6
  catboost_learning_rate: 0.05
  market_blend_min_coverage: 0.999
