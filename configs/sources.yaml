sources:
  historical:
    results_url: "https://raw.githubusercontent.com/martj42/international_results/master/results.csv"
    shootouts_url: "https://raw.githubusercontent.com/martj42/international_results/master/shootouts.csv"
    goalscorers_url: "https://raw.githubusercontent.com/martj42/international_results/master/goalscorers.csv"
  football_data:
    base_url: "https://api.football-data.org/v4/matches"
    default_days_back: 14
    default_days_forward: 2
    timeout_seconds: 30
    rate_limit_sleep_seconds: 60
    retry_count: 3
  worldcup_2026:
    url: "https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json"

external_sources:
  fifa_rankings:
    source_url: "https://inside.fifa.com/fifa-world-ranking/men"
    output_path: "data/external/fifa_rankings.csv"
    raw_dir: "data/raw/fifa_rankings"
    source_type: "html"
    required_columns:
      - date
      - team
      - rank
      - points
  world_football_elo:
    source_url: "https://www.eloratings.net/"
    output_path: "data/external/world_football_elo.csv"
    raw_dir: "data/raw/world_football_elo"
    source_type: "html"
    required_columns:
      - date
      - team
      - elo

